name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The only version knob. The prebuilt dependency set (FFmpeg, Qt6,
  # libdatachannel) is whatever this OBS tag pins for itself — OBS's own
  # buildspec downloads it during configure and we reuse it for the plugin,
  # so the plugin always links the exact DLL versions OBS ships.
  OBS_VERSION: '32.2.2'

jobs:
  windows:
    name: Windows x64
    # Matches the toolchain OBS 32.x is built with upstream (VS 2026,
    # Windows SDK 10.0.26100).
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache OBS SDK and prebuilt deps
        id: cache-obs
        uses: actions/cache@v5
        with:
          path: |
            .deps/obs-install
            .deps/prebuilt
          key: obs-sdk-${{ env.OBS_VERSION }}-x64-vs2026-v1

      - name: Build libobs and collect deps
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $install = "$pwd/.deps/obs-install"

          # Plugins are the only consumers of the submodules, and they are
          # disabled below, so a plain shallow clone is enough.
          git clone --depth 1 --branch ${{ env.OBS_VERSION }} https://github.com/obsproject/obs-studio.git .deps/obs-src

          # Configure downloads the prebuilt deps + Qt6 this OBS tag pins
          # into .deps/obs-src/.deps. obs-frontend-api is built regardless of
          # ENABLE_FRONTEND, so Qt is not needed for this step.
          cmake -S .deps/obs-src -B .deps/obs-build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$install" `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_FRONTEND=OFF
          cmake --build .deps/obs-build --config RelWithDebInfo --target libobs obs-frontend-api
          cmake --install .deps/obs-build --config RelWithDebInfo --component Development
          cmake --install .deps/obs-build --config RelWithDebInfo --component obs_libraries

          # Keep the downloaded dependency tree for the plugin build (and for
          # the cache), then drop the OBS source/build trees.
          Move-Item .deps/obs-src/.deps .deps/prebuilt
          Remove-Item -Recurse -Force .deps/obs-src, .deps/obs-build

      - name: Resolve dependency prefixes
        id: prefixes
        shell: pwsh
        run: |
          $deps = (Get-ChildItem .deps/prebuilt -Directory -Filter 'obs-deps-*-x64' |
                   Where-Object { $_.Name -notlike '*qt6*' } | Select-Object -First 1).FullName
          $qt6  = (Get-ChildItem .deps/prebuilt -Directory -Filter 'obs-deps-qt6-*-x64' |
                   Select-Object -First 1).FullName
          if (-not $deps -or -not $qt6) {
            Get-ChildItem .deps/prebuilt
            throw "Could not locate prebuilt obs-deps directories"
          }
          Write-Host "obs-deps: $deps"
          Write-Host "qt6:      $qt6"
          "prefix=$pwd/.deps/obs-install;$deps;$qt6" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure plugin
        shell: pwsh
        run: |
          cmake -S . -B build_x64 -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ steps.prefixes.outputs.prefix }}" `
            -DOBS_PLUGIN_BASE="$pwd/stage/obs-web-preview"

      - name: Build plugin
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install plugin
        run: cmake --install build_x64 --config RelWithDebInfo

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 9)
            $version = "dev-$shortSha"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact=obs-web-preview-$version-windows-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path stage/obs-web-preview/* -DestinationPath "${{ steps.version.outputs.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-web-preview-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.artifact }}
          draft: true
          generate_release_notes: true
